services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "127.0.0.1:3307:3306"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  # Mailpit : attrape les e-mails envoyés par l'application (rien ne part vraiment)
  mailer:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025"   # serveur SMTP : MAILER_DSN=smtp://127.0.0.1:1025 dans .env.local
      - "127.0.0.1:8025:8025"   # interface web : http://127.0.0.1:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

  # phpMyAdmin : interface web pour la base de données (développement uniquement)
  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      database:
        condition: service_healthy
