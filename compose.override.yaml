
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "127.0.0.1:3307:3306"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  # Mailpit : attrape les e-mails envoyés par l'application (rien ne part vraiment)
  mailer:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025"   # serveur SMTP : MAILER_DSN=smtp://127.0.0.1:1025 dans .env.local
      - "127.0.0.1:8025:8025"   # interface web : http://127.0.0.1:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

  # phpMyAdmin : interface web pour la base de données (développement uniquement)
  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      database:
        condition: service_healthy

  # Ollama : modèles d'IA en local, gratuits (développement des outils IA)
  # Premier lancement : docker compose up -d ollama, puis télécharger un modèle :
  #   docker compose exec ollama ollama pull mistral
  # API : http://127.0.0.1:11434 (OLLAMA_URL dans .env)
  ollama:
    image: ollama/ollama:0.40.5
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Le modèle reste chargé en mémoire 10 minutes après la dernière question (réponses plus rapides)
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      # Les modèles téléchargés (plusieurs Go) sont gardés entre deux redémarrages
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
