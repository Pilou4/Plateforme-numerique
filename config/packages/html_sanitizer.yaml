framework:
    html_sanitizer:
        sanitizers:
            # Nettoie le HTML de la documentation avant affichage :
            # garde la mise en forme (titres, listes, code, tableaux, classes…)
            # et retire tout ce qui est dangereux (scripts, événements onclick…).
            app.documentation_sanitizer:
                allow_safe_elements: true

            # Présentation des projets : comme la documentation, en gardant en plus
            # les classes CSS du contenu (project__text, project__tags…)
            app.project_sanitizer:
                allow_safe_elements: true
                allow_attributes:
                    class: '*'
